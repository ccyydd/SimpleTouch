defaults:
  - model/pi0_5_pytorch_simpletac@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # R24 default uses eight local ranks. Override this only for an
    # explicitly smaller launch, e.g. SIMPLETAC_GPU_PLACEMENT=0-1.
    actor,env,rollout: ${oc.env:SIMPLETAC_GPU_PLACEMENT,0-7}

runner:
  task_type: sft
  # Root checkpoint directory, e.g. .../checkpoints/global_step_10000.
  # The SFT runner restores model/optimizer/scheduler, rank-local dataloader
  # cursor, and RNG state from its actor/ subdirectory.
  resume_dir: null
  logger:
    log_path: ${oc.env:SIMPLETOUCH_OUTPUT_ROOT,./outputs}
    project_name: SimpleTouch
    experiment_name: "simpletouch_${data.task}_fast_multi_s5g6_w0p01_repeat"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: 20000
  val_check_interval: -1
  save_interval: 5000

data:
  train_data_paths: ${oc.env:SIMPLETOUCH_DATA_ROOT,./data/UniVTAC}
  task: insert_hole
  # The launcher selects the canonical camera for each task.
  camera_type: head
  episode_start: 0
  episode_end: 49
  normalization: quantile
  norm_stats_path: ${oc.env:SIMPLETOUCH_NORM_STATS_PATH,./assets/norm_stats/${data.task}/norm_stats.json}
  tokenizer_path: ${oc.env:SIMPLETOUCH_TOKENIZER_PATH,./assets/paligemma_tokenizer.model}
  # Optional .npy cache root generated by scripts/univtac/cache_t3_latents.py.
  # The R24 launchers resolve the validated compact 6x6+CLS future cache
  # for future targets. Direct Hydra training must also provide a validated
  # cache when future loss > 0; online future encoding is forbidden.
  # Current touch is always online. This does not change the target definition.
  tactile_world_cache_path: null
  # Optional training-only 6x6+CLS cache for multi-horizon Tactile-Expert
  # future targets. Current tactile input always remains online.
  tactile_expert_future_cache_path: ${oc.env:SIMPLETOUCH_FUTURE_CACHE_ROOT,null}
  num_workers: 8

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  eval_batch_size: 1
  global_batch_size: 64
  seed: 42
  # The UniVTAC recipe enables this when a nonzero
  # Tactile-Expert auxiliary loss is active. The first probe
  # is at step N; each probe uses three same-RNG backward replays and never
  # contributes to the optimizer step.
  gradient_diagnostics_interval: 2000

  model:
    model_path: ${oc.env:SIMPLETOUCH_BASE_MODEL_PATH,./assets/pi05_base_pytorch_rlinf}

  optim:
    lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 20000
    lr_warmup_steps: 1000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 5.0e-6

  fsdp_config:
    strategy: fsdp
    # SimpleTac prioritizes throughput on high-memory training GPUs. Keep
    # unsharded parameters resident between forward and backward so the
    # action/current-touch/future-touch passes do not repeatedly all-gather
    # the same Transformer weights.
    sharding_strategy: shard_grad_op
    forward_prefetch: true
    backward_prefetch: pre
    use_orig_params: true
    # Keep recomputation disabled by default for every SimpleTac training mode.
    # Memory-constrained experiments may opt in with an explicit Hydra override.
    gradient_checkpointing: false
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
